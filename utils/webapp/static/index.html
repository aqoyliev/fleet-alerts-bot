<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No maximum-scale: it blocks pinch-zoom for everybody and buys nothing. Someone
       reading a unit number on a cracked phone in a yard gets to zoom in. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the WebView that both palettes are handled, so form controls and scrollbars
       render dark on a dark theme instead of flashing their light defaults. -->
  <meta name="color-scheme" content="light dark">
  <title>Admin Panel</title>
  <!-- Telegram's bridge. The one external resource on this page, and it can't be
       vendored: it is how the WebApp object gets wired to the client. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/panel/app.css">
</head>
<body>

<!-- Shown instead of everything else when the page is opened outside Telegram, or when
     the credential has expired. Both are dead ends for the app, so they get the whole
     screen rather than an error toast on top of a UI that cannot work. -->
<div id="blocker" class="blocker" hidden>
  <div class="blocker-emoji" id="blocker-emoji">🔒</div>
  <h1 id="blocker-title">Open this from Telegram</h1>
  <p id="blocker-text">This panel is a Telegram Mini App. Open your bot's chat and tap
    <b>🖥 Admin Panel</b>.</p>
  <button class="btn" id="blocker-action" hidden>Close</button>
  <!-- Filled in when the launch context is wrong. Which of the several reasons applies
       is invisible from the outside — the screen looks identical whether the bridge
       script failed to load, the client is too old, or the button type didn't carry a
       credential — so the answer is put on screen rather than guessed at. -->
  <pre class="diag" id="blocker-diag" hidden></pre>
</div>

<div id="app" hidden>
  <header class="topbar">
    <!-- The company is the title and the screen name is the eyebrow above it. One
         deployment serves one company, so its name is the one fact that identifies what
         you are looking at — and it used to be the smallest text on the page, under a
         20px "Dashboard" that the selected tab was already saying. -->
    <div class="topbar-main">
      <div class="topbar-eyebrow" id="screen-title">Fleet</div>
      <div class="topbar-title" id="company-name"></div>
    </div>
    <!-- Also the revalidation indicator: a cached screen paints instantly, and this is
         what says the numbers on it are still being checked. -->
    <button class="icon-btn" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <!-- Screens are rendered into here by app.js; only one is present at a time. -->
    <div class="loading" id="loading"><span class="spinner"></span></div>
  </main>

  <!-- Line icons in currentColor rather than emoji, so the selected tab's icon takes the
       active colour with its label. -->
  <nav class="tabbar" id="tabbar">
    <!-- Fleet first and selected by default: it is the only screen in this app on
         which something can be wrong, and the bot's own admin DMs send people to it by
         name ("the admin panel, under Unpaired"). -->
    <button class="tab is-active" data-tab="fleet" aria-label="Fleet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 16.5V6.8A.8.8 0 0 1 3.8 6h9.4a.8.8 0 0 1 .8.8v9.7"/>
        <path d="M14 10.5h3.3a1 1 0 0 1 .8.4l2.7 3.4a1 1 0 0 1 .2.6v1.6"/>
        <circle cx="7.3" cy="17" r="1.9"/><circle cx="17.2" cy="17" r="1.9"/>
        <path d="M9.2 17h6.1M3 17h1.4M19.1 17H21"/>
      </svg>
      <span class="tab-label">Fleet</span>
    </button>
    <button class="tab" data-tab="alerts" aria-label="Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8.6a6 6 0 1 0-12 0c0 5.1-2 6.6-2 6.6h16s-2-1.5-2-6.6Z"/>
        <path d="M10.3 19a2 2 0 0 0 3.4 0"/>
      </svg>
      <span class="tab-label">Alerts</span>
    </button>
    <button class="tab" data-tab="report" aria-label="Report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M6 20v-6M12 20V5M18 20v-9"/>
      </svg>
      <span class="tab-label">Report</span>
    </button>
    <!-- Admins and personal notification switches live behind here. Both are rare --
         one is used a handful of times in a deployment's life -- and a permanent tab is
         a promise about how often you will go somewhere. -->
    <button class="tab" data-tab="more" aria-label="More">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
        <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/>
        <circle cx="19" cy="12" r="1.7"/>
      </svg>
      <span class="tab-label">More</span>
    </button>
  </nav>
</div>

<script src="/panel/app.js"></script>
</body>
</html>
