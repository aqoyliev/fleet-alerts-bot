<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Admin Panel</title>
  <!-- Telegram's bridge. The one external resource on this page, and it can't be
       vendored: it is how the WebApp object gets wired to the client. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/panel/app.css">
</head>
<body>

<!-- Shown instead of everything else when the page is opened outside Telegram, or when
     the credential has expired. Both are dead ends for the app, so they get the whole
     screen rather than an error toast on top of a UI that cannot work. -->
<div id="blocker" class="blocker" hidden>
  <div class="blocker-emoji" id="blocker-emoji">🔒</div>
  <h1 id="blocker-title">Open this from Telegram</h1>
  <p id="blocker-text">This panel is a Telegram Mini App. Open your bot's chat and tap
    <b>🖥 Admin Panel</b>.</p>
  <button class="btn" id="blocker-action" hidden>Close</button>
  <!-- Filled in when the launch context is wrong. Which of the several reasons applies
       is invisible from the outside — the screen looks identical whether the bridge
       script failed to load, the client is too old, or the button type didn't carry a
       credential — so the answer is put on screen rather than guessed at. -->
  <pre class="diag" id="blocker-diag" hidden></pre>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-title" id="screen-title">Dashboard</div>
    <div class="topbar-sub" id="company-name"></div>
  </header>

  <main id="main">
    <!-- Screens are rendered into here by app.js; only one is present at a time. -->
    <div class="loading" id="loading"><span class="spinner"></span></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="dashboard">
      <span class="tab-icon">📊</span><span class="tab-label">Dashboard</span>
    </button>
    <button class="tab" data-tab="alerts">
      <span class="tab-icon">🔔</span><span class="tab-label">Alerts</span>
    </button>
    <button class="tab" data-tab="admins">
      <span class="tab-icon">⚙️</span><span class="tab-label">Admins</span>
    </button>
  </nav>
</div>

<script src="/panel/app.js"></script>
</body>
</html>
