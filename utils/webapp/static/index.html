<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No maximum-scale: it blocks pinch-zoom for everybody and buys nothing. Someone
       reading a unit number on a cracked phone in a yard gets to zoom in. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the WebView that both palettes are handled, so form controls and scrollbars
       render dark on a dark theme instead of flashing their light defaults. -->
  <meta name="color-scheme" content="light dark">
  <title>Admin Panel</title>
  <!-- Telegram's bridge. The one external resource on this page, and it can't be
       vendored: it is how the WebApp object gets wired to the client. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/panel/app.css">
</head>
<body>

<!-- Shown instead of everything else when the page is opened outside Telegram, or when
     the credential has expired. Both are dead ends for the app, so they get the whole
     screen rather than an error toast on top of a UI that cannot work. -->
<div id="blocker" class="blocker" hidden>
  <div class="blocker-emoji" id="blocker-emoji">🔒</div>
  <h1 id="blocker-title">Open this from Telegram</h1>
  <p id="blocker-text">This panel is a Telegram Mini App. Open your bot's chat and tap
    <b>🖥 Admin Panel</b>.</p>
  <button class="btn" id="blocker-action" hidden>Close</button>
  <!-- Filled in when the launch context is wrong. Which of the several reasons applies
       is invisible from the outside — the screen looks identical whether the bridge
       script failed to load, the client is too old, or the button type didn't carry a
       credential — so the answer is put on screen rather than guessed at. -->
  <pre class="diag" id="blocker-diag" hidden></pre>
</div>

<div id="app" hidden>
  <header class="topbar">
    <!-- A detail screen is a page you walked into, so it carries its own way out as well as
         Telegram's BackButton: the desktop client and some older WebViews do not draw one. -->
    <button class="icon-btn icon-btn-bordered" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 6-6 6 6 6"/>
      </svg>
    </button>
    <!-- The company is the title and the screen name is the eyebrow above it. One
         deployment serves one company, so its name is the one fact that identifies what
         you are looking at — and it used to be the smallest text on the page, under a
         20px "Dashboard" that the selected tab was already saying. -->
    <div class="topbar-main">
      <div class="topbar-eyebrow" id="screen-title">Fleet</div>
      <div class="topbar-title" id="company-name"></div>
    </div>
    <!-- Also the revalidation indicator: a cached screen paints instantly, and this is
         what says the numbers on it are still being checked. -->
    <button class="icon-btn icon-btn-bordered" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <!-- Screens are rendered into here by app.js; only one is present at a time. -->
    <div class="loading" id="loading"><span class="spinner"></span></div>
  </main>

  <!-- Four places, all of them somewhere people go on purpose: the fleet, the numbers, who
       can run the bot, and the admin's own switches. Fleet comes first and is selected by
       default: it is the only screen on which something can be wrong, and the bot's own admin
       DMs send people to it by name ("the admin panel, under Unpaired"). Line icons in
       currentColor rather than emoji, so the selected tab's icon takes the active colour
       with its label.

       There is no Alerts tab. The panel is for setting the fleet up and reading how it is
       doing; the alerts themselves arrive in Telegram, where they are acted on. -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="fleet" aria-label="Fleet">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 16.5V6.8A.8.8 0 0 1 3.8 6h9.4a.8.8 0 0 1 .8.8v9.7"/>
        <path d="M14 10.5h3.3a1 1 0 0 1 .8.4l2.7 3.4a1 1 0 0 1 .2.6v1.6"/>
        <circle cx="7.3" cy="17" r="1.9"/><circle cx="17.2" cy="17" r="1.9"/>
        <path d="M9.2 17h6.1M3 17h1.4M19.1 17H21"/>
        </svg>
      </span>
      <span class="tab-label">Fleet</span>
    </button>
    <button class="tab" data-tab="report" aria-label="Report">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 20v-6M12 20V5M18 20v-9"/>
        </svg>
      </span>
      <span class="tab-label">Report</span>
    </button>
    <button class="tab" data-tab="admins" aria-label="Admins">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.5-3.2 2.9-5 5.5-5s5 1.8 5.5 5"/>
        <circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.2c2.3.1 3.8 1.6 4.2 4"/>
        </svg>
      </span>
      <span class="tab-label">Admins</span>
    </button>
    <button class="tab" data-tab="settings" aria-label="Settings">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/>
        <circle cx="9" cy="17" r="2.2"/>
        </svg>
      </span>
      <span class="tab-label">Settings</span>
    </button>
  </nav>
</div>

<!-- If the panel dies before it paints, the page used to stay a flat colour with nothing on
     it -- indistinguishable, from the outside, from a page that never loaded, and no way to
     tell a client that cannot run it from a bug. This says what happened instead. It is
     inline and sits ahead of app.js so it also catches app.js failing to parse. Once the
     app is on screen it stands down: the panel reports its own errors from there. -->
<script>
(function () {
  function say(message) {
    var app = document.getElementById('app');
    var blocker = document.getElementById('blocker');
    if (!blocker || (app && !app.hidden)) return;
    var wa = window.Telegram && window.Telegram.WebApp;
    document.getElementById('blocker-emoji').textContent = '⚠️';
    document.getElementById('blocker-title').textContent = 'The panel did not start';
    document.getElementById('blocker-text').textContent =
      'Close it and open it again. If this stays, send a screenshot of this screen.';
    var diag = document.getElementById('blocker-diag');
    diag.textContent = [
      'error    : ' + String(message).slice(0, 300),
      'platform : ' + ((wa && wa.platform) || '—'),
      'version  : ' + ((wa && wa.version) || '—'),
      'agent    : ' + navigator.userAgent.slice(0, 160),
    ].join('\n');
    diag.hidden = false;
    blocker.hidden = false;
  }
  window.addEventListener('error', function (e) {
    say((e.message || 'script error') + (e.filename ? ' @ ' + e.filename.split('/').pop()
      + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    say((e.reason && e.reason.message) || e.reason || 'unhandled rejection');
  });
})();
</script>
<script src="/panel/app.js"></script>
</body>
</html>
